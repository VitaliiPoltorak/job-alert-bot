name: Check new jobs

on:
  schedule:
    # Каждые 30 минут. Синтаксис cron — в UTC.
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # позволяет запустить вручную из вкладки Actions

# Нужно право писать в репозиторий, чтобы закоммитить обновлённый seen.json
permissions:
  contents: write

# Не даём параллельным запускам (например, ручному во время планового) гоняться
# за пушем в main — ставим их в очередь вместо гонки.
concurrency:
  group: check-jobs
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run job check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run check

      - name: Commit updated state
        run: |
          git config user.name "job-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          git diff --quiet --cached || git commit -m "Update seen jobs state [skip ci]"

          # На случай гонки с другим запуском ретраим push с рибейзом.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected, fetching and rebasing (attempt $i)..."
            git fetch origin
            git rebase origin/$(git rev-parse --abbrev-ref HEAD)
            sleep $((RANDOM % 10 + 1))
          done
          git push
